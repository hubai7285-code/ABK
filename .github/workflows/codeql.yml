name: CodeQL

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  schedule:
    - cron: "28 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}
          dependency-caching: true

      - name: Set up JDK
        if: ${{ matrix.language == 'java-kotlin' || matrix.language == 'c-cpp' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: ${{ matrix.language == 'java-kotlin' || matrix.language == 'c-cpp' }}
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          # 手动安装 command-line tools 并安装所需组件，避免使用已失效的 android-actions/setup-android@v3
          # (该 action 会执行 `sdkmanager tools`，而 Google 已移除 legacy 'tools' 包，导致 step 失败)
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdtools.zip"
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          # `yes` 在 sdkmanager 读完后会被 SIGPIPE 终止(退出码 141)，在 pipefail 下会被误判为失败；
          # 因此显式吞掉该退出码（否则本步骤会在 "All SDK package licenses accepted" 之后报 exit code 1）。
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 \
            "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          {
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            echo "$ANDROID_SDK_ROOT/platform-tools"
            echo "$ANDROID_SDK_ROOT/build-tools/37.0.0"
            echo "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          } >> "$GITHUB_PATH"

      - name: Set up Gradle
        if: ${{ matrix.language == 'java-kotlin' || matrix.language == 'c-cpp' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Java/Kotlin sources for CodeQL
        if: ${{ matrix.language == 'java-kotlin' }}
        run: >-
          gradle --no-daemon --no-build-cache --rerun-tasks
          :app:compileDebugKotlin :app:compileDebugJavaWithJavac

      - name: Build native sources for CodeQL
        if: ${{ matrix.language == 'c-cpp' }}
        run: >-
          gradle --no-daemon --no-build-cache --rerun-tasks
          ':app:buildCMakeDebug[arm64-v8a]'
          ':app:buildCMakeDebug[armeabi-v7a]'
          ':app:buildCMakeDebug[x86]'
          ':app:buildCMakeDebug[x86_64]'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
