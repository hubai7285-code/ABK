name: OnePlus 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ===== OnePlus 专有: 机型选择 =====
      cpu:
        description: "OnePlus/Oplus CPU 分支"
        required: true
        type: choice
        options:
          - sm8850
          - sm8750
          - sm8735
          - mt6991
          - sm8650
          - mt6989
          - sm8635
          - sm8550
          - sm8450
          - sm8475
          - sm7675
          - sm7635
          - sm7550
          - sm6375
        default: sm8650
      device_manifest:
        description: "ABK 机型配置（值为上游 XML 名称，构建摘要会明确显示系统版本）"
        required: true
        type: choice
        options:
          - oneplus_15
          - oneplus_15t
          - oneplus_13_b
          - oneplus_13s_b
          - oneplus_13t_b
          - oneplus_ace5_pro_b
          - oneplus_ace_6
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace5_ultra_b
          - oneplus_turbo_6
          - oneplus_12_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_13r_b
          - oneplus_pad2_b
          - oneplus_pad_pro_b
          - oneplus_ace5_race_b
          - oneplus_nord_5_b
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_ace_pro_v
          - oneplus_10_pro_b
          - oneplus_ace_3v_b
          - oneplus_turbo_6v
          - oneplus_nord_4_b
          - oneplus_nord_ce4_lite_5g
          - oneplus_nord_ce4_b
        default: oneplus_12_b

      # ===== 以下选项与 kernel-custom.yml (GKI 自定义构建) 对齐 =====
      # 注意: workflow_dispatch 最多 25 个 inputs, 因此 OnePlus 侧省略了
      # sub_level / os_patch_level / revision (由 OnePlus manifest 决定, 纯元数据)
      # 与 virtualization_support (OnePlus 内核树无对应补丁);
      # 这些输入在 oneplus-build.yml 中仍然保留, 供可复用工作流直接调用。
      android_version:
        description: "内核 Android KMI 版本"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android14
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "6.1"
      ksu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - None
          - Official
          - SukiSU
          - ReSukiSU
          - KernelSU-Next
        default: SukiSU
      kernelsu_branch:
        description: "KSU 分支"
        required: false
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Latest(最新)
          - Custom(自定义)
        default: Stable(标准)
      custom_ref:
        description: "自定义引用 (仅在KSU分支为'Custom(自定义)'时使用)"
        required: false
        type: string
        default: ""
      version:
        description: "自定义版本名 (可选, 追加到产物名)"
        required: false
        type: string
        default: ""
      build_time:
        description: "自定义构建时间 (如 'Tue Mar 10 03:53:33 UTC 2026', 留空=当前 UTC)"
        required: false
        type: string
        default: ""
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: false
        type: boolean
        default: true
      use_ddk:
        description: "启用 DDK 防格机 LSM"
        required: false
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（IPSet + BBR）"
        required: false
        type: boolean
        default: false
      use_kpm:
        description: "启用 KPM 功能（仅 SukiSU/ReSukiSU）"
        required: false
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS（取消勾选=启用 SUSFS；仅 android14/6.1、android15/6.6、android16/6.12 支持）"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持（OnePlus 树通常已内置，无独立补丁时自动跳过）"
        required: false
        type: boolean
        default: false
      zram_full_algo:
        description: "启用 ZRAM 完整算法支持（6.12 自动跳过 legacy LZ4K/LZ4KD/LZ4K_OPLUS）"
        required: false
        type: boolean
        default: false
      zram_extra_algos:
        description: "自定义 ZRAM 算法（逗号分隔，如 lzo,lz4,deflate,zstd,lz4kd；6.12 会忽略 lz4k/lz4kd/lz4k_oplus）"
        required: false
        type: string
        default: ""
      kpm_password:
        description: "自定义 KPM 超级密码（留空=使用默认密码）"
        required: false
        type: string
        default: ""
      custom_external_modules:
        description: "自定义外部模块（module:repo;stage 或 set:repo#child;stage, 用 | 分隔; 尽力构建）"
        required: false
        type: string
        default: ""
      custom_kernel_options:
        description: "自定义内核选项（每行一条 Kconfig/defconfig 片段）"
        required: false
        type: string
        default: ""

      # ===== OnePlus 专有: 风驰调度器 / Unicode 绕过 =====
      use_fengchi:
        description: "启用风驰(hmbird)调度器补丁(仅推荐 android15/6.6)"
        required: false
        type: boolean
        default: false
      use_unicode_bypass:
        description: "启用 Unicode 零宽绕过修复"
        required: false
        type: boolean
        default: false

jobs:
  get-manager:
    name: 上传管理器和 SUSFS 模块
    if: ${{ inputs.ksu_variant != 'None' }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.ksu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      custom_ref: ${{ inputs.custom_ref || '' }}

  build-oneplus-kernel:
    name: "${{ inputs.device_manifest }}-${{ inputs.kernel_version }}-${{ inputs.ksu_variant }}"
    uses: ./.github/workflows/oneplus-build.yml
    secrets: inherit
    with:
      cpu: ${{ inputs.cpu }}
      device_manifest: ${{ inputs.device_manifest }}
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      ksu_variant: ${{ inputs.ksu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      custom_ref: ${{ inputs.custom_ref || '' }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      supp_op: ${{ inputs.supp_op || false }}
      zram_full_algo: ${{ inputs.zram_full_algo || false }}
      zram_extra_algos: ${{ inputs.zram_extra_algos || '' }}
      kpm_password: ${{ inputs.kpm_password || '' }}
      custom_external_modules: ${{ inputs.custom_external_modules || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}
      use_fengchi: ${{ inputs.use_fengchi }}
      use_unicode_bypass: ${{ inputs.use_unicode_bypass }}
